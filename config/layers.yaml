layers:
  1: true
  2: true
  3: true

checks:
  A: true
  B: true
  C: true
  classifier: true

layer2:
  heartbeat_seconds: 5          # agent sends a signed heartbeat this often
  silence_seconds: 15           # witness alarm after this long without one
  challenge_poll_seconds: 2     # agent asks the witness for a random check this often
  challenge_deadline_seconds: 5 # answer within this, or missed_challenge
  challenge_chance: 0.2         # chance a poll gets a check (demo: 0.5)
  state_share: 0.3              # share of checks that are balance (Check C) questions
  record_share: 0.4             # share that ask for a specific record #N; the rest ask for the latest hash
  sweep_seconds: 15             # rolling sweep of every record this often
  sweep_batch: 200
  balance_recheck_seconds: 3     # a balance mismatch is re-asked after this long; alert only if it persists

layer1:
  mode: deception              # deception = decoy editor, real file untouched, attempted diff captured; block = refuse
  protected_paths:             # file commands trip only inside these
    - /var/log/bank
  editors: [nano, vi, vim, gedit]                           # trip on any file without the profile-id
  file_commands: [rm, mv, cp, sed, truncate, shred, cat]    # trip inside protected_paths without the profile-id
  watch_cd: true               # cd into a protected path is reported
  profiles_file: /etc/coc/profiles   # profile-id hashes per platform (python -m layers.l1_tripwire.profiles add <platform>)
  backstop:                    # catches bypasses of the wrappers (full path, other tools, temp-file rename)
    enabled: true              # auditd where the kernel allows it; inotify + /proc attribution otherwise
    watch: []                  # default: protected_paths
    allowed_writers: []        # the platform's own processes that write there (matched in their command line)

layer3:
  after_seconds: 45            # no contact with the witness for this long = quarantine
  dry_run: true                # true = record the commands below without running them (set false on the real server)
  evidence_dir: /var/lib/coc/quarantine
  users: auto                  # root + every account with a login shell; or a list
  capture:                     # 1 capture (never reboot anywhere)
    - ps aux
    - ss -tnp
    - who
  site_down: []                # 3 platform hooks, e.g. "docker compose -f /opt/bank/docker-compose.yml stop frontend"
  site_up: []
  lockout:                     # 4 lock everyone out (run for every user, root included)
    - touch /etc/nologin
    - passwd -l {user}               # no password logins
    - usermod --expiredate 1 {user}  # account expired: SSH keys, su and sudo refused too
  end_sessions: true           # then kill every login-session process (tty or login uid), never the agent itself
  unlock:                      # reversed after a witness-signed unlock (2 of 3 key holders)
    - usermod --expiredate '' {user}
    - passwd -u {user}
    - rm -f /etc/nologin
  key_holders: [SOC lead, Auditor, Compliance officer]
  approvals_needed: 2
