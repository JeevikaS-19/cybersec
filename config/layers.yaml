layers:
  1: true
  2: true
  3: true

checks:
  A: true
  B: true
  C: true
  classifier: true

layer1:
  mode: deception              # deception = decoy editor, real file untouched, attempted diff captured; block = refuse
  protected_paths:             # file commands trip only inside these
    - /var/log/bank
  editors: [nano, vi, vim, gedit]                           # trip on any file without the profile-id
  file_commands: [rm, mv, cp, sed, truncate, shred, cat]    # trip inside protected_paths without the profile-id
  watch_cd: true               # cd into a protected path is reported
  profiles_file: /etc/coc/profiles   # profile-id hashes per platform (python -m layers.l1_tripwire.profiles add <platform>)
